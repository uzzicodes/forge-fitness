<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/fitness/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10130f">
  <meta name="description" content="Build strength. Fuel the change. Your local meal journal and training companion.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FORGE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>FORGE · Build your everyday</title>
  <style>html,body{margin:0;background:#10130f;color:#d4fb60;font-family:Arial,sans-serif}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:15px}#loading strong{font-size:32px;letter-spacing:8px}#loading span{font-size:12px;letter-spacing:2px;color:#9aa294}#loading i{margin:10px auto;width:25px;height:25px;border:2px solid #30362c;border-top-color:#d4fb60;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
<script src="/vision/vision.js" defer></script>
<script src="/vision/barcode.min.js" defer></script>
</head>
<body>
  <div id="loading" role="status"><strong>ϟ FORGE</strong><span>BUILD YOUR EVERYDAY</span><i></i></div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
<script>
(function(){
  function notice(text){let el=document.getElementById('offline-status');if(!el){el=document.createElement('div');el.id='offline-status';el.style.cssText='position:fixed;z-index:9999;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:12px Arial,sans-serif;background:#d4fb60;color:#10130f;padding:9px 14px;border-radius:30px;box-shadow:0 4px 30px #0005;max-width:85%;text-align:center;pointer-events:none';document.body.appendChild(el);}el.textContent=text;setTimeout(()=>el.remove(),6500);}
  window.addEventListener('flutter-first-frame',async()=>{
    if(!('serviceWorker' in navigator)||!window.isSecureContext)return;
    navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='FORGE_OFFLINE_READY')notice('Offline ready · AI estimates still need a connection');});
    try{await navigator.serviceWorker.register('/forge-sw.js');const registration=await navigator.serviceWorker.ready;registration.active?.postMessage('FORGE_CACHE_STATUS');}
    catch(error){notice('Offline files could not be saved. Keep connected and reopen to retry.');}
  },{once:true});
})();
</script>
<script>
if('serviceWorker' in navigator){
 const forgeHadController=Boolean(navigator.serviceWorker.controller);let forgeReloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(forgeHadController&&!forgeReloading){forgeReloading=true;location.reload();}});
}
</script>
</body>
</html>
